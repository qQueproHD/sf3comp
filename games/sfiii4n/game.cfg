# Street Fighter III 3rd Strike: 4rd Arrange Edition 2013 ("4rd Strike"), a fan rebalance of 3rd Strike made on its
# 990608 revision (games/sfiii3n): its own program and two graphics files. A game of its own on the toolkit, with what
# the other Street Fighter III games share (games/shared/sf3), never the definitive version's own sources (990512's
# code, which a balance hack changes). Per-game settings read by the toolkit (CMake,
# tools and launcher via tools/gamecfg.py).

name = Street Fighter III 4rd Strike
title = Street Fighter III 4rd Strike (4rd Arrange Edition 2013)
id = sfiii4n
app_id = io.github.tmcleroy.sf3comp.fourthstrike
disclaimer = Not affiliated with Capcom.

# The hack's set: 990608's "NO CD" set with the program (the first SIMM) and the fifth SIMM's last two files its own
rom_set = sfiii4n
rom_parent = sfiii3
rom_name = Street Fighter III 3rd Strike: 4rd Arrange Edition 2013 (Japan 990608, NO CD, hack)
# In the collection: after the definitive version
collection_order = 3
# The launcher's first page's switch
display = widescreen|Widescreen|16:9: more of the stage at each side (the corners come a little sooner).

# The sources it shares with the other Street Fighter III games (games/shared/sf3; its own facts in src/)
shared_sources = shared/sf3

